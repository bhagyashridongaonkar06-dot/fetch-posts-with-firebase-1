<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-3">
                <div class="card">
                    <div class="card-header text-center bg-dark text-white">
                       <h5>Post Form</h5>
                    </div>
                    <div class="card-body">
                        <form action="" id="postForm">
                            <div class="form-group">
                                <label for="title">Enter Title</label>
                                <input type="text" class="form-control" id="title">
                            </div>

                            <div class="form-group">
                                <label for="content">Enter Content</label>
                                <textarea class="form-control" id="content"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="title">Enter UserId</label>
                                <select class="form-control" id="userId">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-sm btn-block btn-dark" id="addPost">Add Post</button>
                            <button type="button" class="btn btn-sm btn-block btn-warning d-none" id="updatePost">Update Post</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid mt-5">
        <div class="row" id="postContainer">

                        <button class="btn btn-sm btn-info">Edit</button>
                        <button class="btn btn-sm btn-warning">Remove</button>
                     </div>
                </div>
            </div> -->

<div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
